    - "/Users/Apple/Folia-source/docs/adr/0021-comparison-mode-keeps-independent-save-streams.md"
  required_outcomes:
    - "重叠根因修复、旧 SVG 无损升级和完整实用编辑器交付。"
    - "Markdown 脑图、一键可视化工作簿和成品图共用升级交付。"
    - "左 Markdown 右图表的对照、快速更新、选区生成和后台队列交付。"
    - "质量与事实检查、净化 SVG/PNG/PDF 导出交付。"
    - "两份真实 SVG、全量测试、压力测试、生产构建和安装后真机验收通过。"
  execution_rules:
    - "不调用 cross-model-delivery，不把工作单元交给其他模型或子代理。"
    - "同一执行者维护完整上下文、实现顺序、缺陷记录和回归结果。"
    - "不中途向用户请求阶段审批；仅真正外部硬阻塞可以停止。"
    - "每个阶段通过调试闭环和门禁后才继续；失败功能隐藏且目标不得虚报完成。"
    - "不得推送、创建 PR、发布或部署。"
  checks:
    - "npm test"
    - "npm run typecheck"
    - "npm run lint"
    - "npm run test:e2e"
    - "cd src-tauri && cargo test --offline --lib"
    - "npm run build"
    - "npm run tauri:build:local"
    - "生产候选 E2E 连续 3 次"
    - "保存/历史各至少 100 轮，生成队列至少 50 组"
    - "安装后的真实 Tauri 应用不少于 30 分钟稳定性点验"
  authority:
    local_dependency_install: true
    local_build: true
    package: true
    install: true
    push: false
    pull_request: false
    publish: false
    deploy: false
