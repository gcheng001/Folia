  <path d="M 380 400 Q 380 450 280 500" stroke="#8B7355" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 380 400 Q 380 450 480 500" stroke="#8B7355" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 380 400 Q 380 450 200 530" stroke="#8B7355" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 380 400 Q 380 450 560 530" stroke="#8B7355" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

