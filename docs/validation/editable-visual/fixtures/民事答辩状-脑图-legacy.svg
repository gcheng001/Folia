  <path d="M 700 210 Q 900 240 1020 280" stroke="#8B7355" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 700 210 Q 380 250 260 320" stroke="#8B7355" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 700 210 Q 1020 250 1140 320" stroke="#8B7355" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

