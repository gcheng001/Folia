  <text x="700" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#666666">(2026)浙03民终4068号 买卖合同纠纷</text>

  <!-- Connection Lines (drawn first) -->
