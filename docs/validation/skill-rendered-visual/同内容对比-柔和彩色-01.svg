<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet">
  <!-- 同内容对比 · 柔和彩色 · 关系图 · 来源：hearing-realistic.md -->
  <defs>
    <style>
      .bg { fill: #FAF7F0; }
      .title { font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 24px; font-weight: 600; fill: #3A3530; }
      .subtitle { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 13px; fill: #8A7F70; }
      .entity-box { stroke-width: 1.4; }
      .entity-role { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-anchor: middle; }
      .entity-name { font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 17px; font-weight: 600; text-anchor: middle; }
      .entity-sub { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 11px; fill: #6B5E4F; text-anchor: middle; }
      .term-box { stroke-width: 1.2; }
      .term-h { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-anchor: middle; }
      .term-b { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 12px; fill: #3A3530; text-anchor: middle; }
      .term-mono { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .term-sub { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 10px; fill: #6B5E4F; text-anchor: middle; }
      .center-fill { fill: #F0E6D2; stroke: #B89F7A; stroke-width: 1.8; }
      .center-title { font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 16px; font-weight: 600; fill: #5C4A2E; text-anchor: middle; }
      .center-sub { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 11px; fill: #6B5E4F; text-anchor: middle; }
      .center-tag { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 10px; font-weight: 600; fill: #8A6F4A; letter-spacing: 0.15em; text-anchor: middle; }
      .line { stroke-width: 1.6; fill: none; }
      .line-blue { stroke: #8BB3D9; }
      .line-peach { stroke: #D89B91; }
      .line-sage { stroke: #9DB89D; }
      .line-lilac { stroke: #B19EC4; }
      .line-label { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .line-label-bg { fill: #FAF7F0; }
      .footer { font-family: 'PingFang SC', sans-serif; font-size: 11px; fill: #B0A28F; }
    </style>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8BB3D9"/>
    </marker>
    <marker id="arrow-peach" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#D89B91"/>
    </marker>
    <marker id="arrow-sage" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9DB89D"/>
    </marker>
    <marker id="arrow-lilac" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B19EC4"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="900"/>

  <text class="title" x="60" y="56">保险关系与争议条款</text>
  <text class="subtitle" x="60" y="80">同一组事实 · 关系图 · 柔和彩色风格</text>
  <text class="subtitle" x="1140" y="56" text-anchor="end">案由：追偿权纠纷</text>
  <text class="subtitle" x="1140" y="80" text-anchor="end">被告二：乙保险公司</text>

  <!-- 连接线 -->
  <line class="line line-blue" x1="190" y1="270" x2="190" y2="650" marker-end="url(#arrow-blue)"/>
  <line class="line line-lilac" x1="1010" y1="270" x2="1010" y2="650" marker-end="url(#arrow-lilac)"/>
  <line class="line line-sage" x1="310" y1="695" x2="890" y2="225" marker-end="url(#arrow-sage)"/>
  <line class="line line-peach" x1="890" y1="695" x2="310" y2="225" marker-end="url(#arrow-peach)"/>

  <!-- 投保人（左上 · 柔和天蓝） -->
  <g>
    <rect class="entity-box" x="70" y="180" width="240" height="90" rx="14" stroke="#8BB3D9" fill="#EFF4F9"/>
    <text class="entity-role" x="190" y="208" fill="#6B89A8">投 保 人</text>
    <text class="entity-name" x="190" y="234" fill="#3D5A75">丙网络科技公司</text>
    <text class="entity-sub" x="190" y="256">书面订立合同</text>
  </g>

  <!-- 被保险人（右上 · 柔和桃粉） -->
  <g>
    <rect class="entity-box" x="890" y="180" width="240" height="90" rx="14" stroke="#E8B7B0" fill="#FBEFEC"/>
    <text class="entity-role" x="1010" y="208" fill="#B57C72">被保险人</text>
    <text class="entity-name" x="1010" y="234" fill="#9C5F56">被告甲</text>
    <text class="entity-sub" x="1010" y="256">配送骑手 · 保险利益归属</text>
  </g>

  <!-- 保险人（左下 · 柔和鼠尾草） -->
  <g>
    <rect class="entity-box" x="70" y="650" width="240" height="90" rx="14" stroke="#A8C2A8" fill="#F2F6F0"/>
    <text class="entity-role" x="190" y="678" fill="#7E9876">保 险 人</text>
    <text class="entity-name" x="190" y="704" fill="#5C7350">乙保险公司</text>
    <text class="entity-sub" x="190" y="726">主张免赔</text>
  </g>

  <!-- 第三者（右下 · 柔和丁香） -->
  <g>
    <rect class="entity-box" x="890" y="650" width="240" height="90" rx="14" stroke="#C8B5D6" fill="#F3EFF6"/>
    <text class="entity-role" x="1010" y="678" fill="#9179A6">第 三 者</text>
    <text class="entity-name" x="1010" y="704" fill="#6E5783">案外人甲</text>
    <text class="entity-sub" x="1010" y="726">受害方 · 死亡</text>
  </g>

  <!-- 中心 -->
  <ellipse class="center-fill" cx="600" cy="460" rx="170" ry="58"/>
  <text class="center-tag" x="600" y="428">保险合同核心</text>
  <text class="center-title" x="600" y="456">附加个人第三者责任保险</text>
  <text class="center-sub" x="600" y="478">某短期意外伤害保险 · 附加险</text>

  <!-- 连接线标签（在中心椭圆之后绘制，确保不被遮挡；位置远离中心文字/边框） -->
  <rect class="line-label-bg" x="160" y="380" width="60" height="20" rx="10"/>
  <text class="line-label" x="190" y="394" fill="#6B89A8">投保</text>
  <rect class="line-label-bg" x="980" y="380" width="60" height="20" rx="10"/>
  <text class="line-label" x="1010" y="394" fill="#9179A6">侵权</text>
  <rect class="line-label-bg" x="540" y="380" width="120" height="20" rx="10"/>
  <text class="line-label" x="600" y="394" fill="#7E9876">保险合同承保</text>
  <rect class="line-label-bg" x="540" y="525" width="120" height="20" rx="10"/>
  <text class="line-label" x="600" y="539" fill="#9C5F56">主张赔偿</text>

  <!-- 限额条款 -->
  <g>
    <rect class="term-box" x="490" y="80" width="220" height="70" rx="12" stroke="#A8C2A8" fill="#F2F6F0"/>
    <text class="term-h" x="600" y="102" fill="#7E9876">限额与免赔</text>
    <text class="term-mono" x="600" y="124" fill="#5C7350">75 万 − 20 万 = 55 万</text>
    <text class="term-b" x="600" y="142">第三者人身伤亡</text>
  </g>

  <!-- 责任免除 -->
  <g>
    <rect class="term-box" x="40" y="425" width="200" height="70" rx="12" stroke="#E8B7B0" fill="#FBEFEC"/>
    <text class="term-h" x="140" y="447" fill="#B57C72">责任免除</text>
    <text class="term-b" x="140" y="467">第七条第三点</text>
    <text class="term-sub" x="140" y="485">无证 / 无行驶证 免责</text>
  </g>

  <!-- 第九条 -->
  <g>
    <rect class="term-box" x="960" y="425" width="200" height="70" rx="12" stroke="#D89B91" fill="#FBEFEC"/>
    <text class="term-h" x="1060" y="447" fill="#9C5F56">条款第九条</text>
    <text class="term-b" x="1060" y="467">第九条</text>
    <text class="term-sub" x="1060" y="485">未赔偿不赔</text>
  </g>

  <!-- 特别约定 -->
  <g>
    <rect class="term-box" x="490" y="770" width="220" height="70" rx="12" stroke="#C8B5D6" fill="#F3EFF6"/>
    <text class="term-h" x="600" y="792" fill="#9179A6">特别约定</text>
    <text class="term-b" x="600" y="812">特别约定 9 · 交通工具</text>
    <text class="term-sub" x="600" y="830">无有效行驶证 / 未持证</text>
  </g>

  <line x1="60" y1="860" x2="1140" y2="860" stroke="#E0D6C2" stroke-width="1"/>
  <text class="footer" x="60" y="884">来源：src/services/mindmap/__fixtures__/hearing-realistic.md</text>
  <text class="footer" x="1140" y="884" text-anchor="end">同内容对比 · 柔和彩色 · 04</text>
</svg>
