<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet">
  <!-- 同内容对比 · 简洁商务 · 关系图 · 来源：hearing-realistic.md -->
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .title { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 24px; font-weight: 600; fill: #111827; letter-spacing: -0.01em; }
      .subtitle { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 13px; fill: #6B7280; }
      .entity-box { fill: #F9FAFB; stroke-width: 1.4; stroke: #1F2937; }
      .entity-role { font-family: 'PingFang SC', sans-serif; font-size: 11px; font-weight: 600; fill: #6B7280; letter-spacing: 0.15em; text-anchor: middle; }
      .entity-name { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 17px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .entity-sub { font-family: 'PingFang SC', sans-serif; font-size: 11px; fill: #4B5563; text-anchor: middle; }
      .term-box { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1; }
      .term-h { font-family: 'PingFang SC', sans-serif; font-size: 10px; font-weight: 600; fill: #2563EB; letter-spacing: 0.15em; text-anchor: middle; }
      .term-b { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 12px; fill: #1F2937; text-anchor: middle; }
      .term-mono { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 12px; fill: #2563EB; text-anchor: middle; }
      .term-sub { font-family: 'PingFang SC', sans-serif; font-size: 10px; fill: #6B7280; text-anchor: middle; }
      .center-fill { fill: #1F2937; stroke: none; }
      .center-title { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .center-sub { font-family: 'PingFang SC', sans-serif; font-size: 11px; fill: #D1D5DB; text-anchor: middle; }
      .center-tag { font-family: 'PingFang SC', sans-serif; font-size: 9px; fill: #60A5FA; letter-spacing: 0.2em; text-anchor: middle; }
      .line { stroke-width: 1.4; fill: none; stroke: #1F2937; }
      .line-accent { stroke: #2563EB; }
      .line-label { font-family: 'PingFang SC', sans-serif; font-size: 11px; font-weight: 500; fill: #1F2937; text-anchor: middle; }
      .line-label-bg { fill: #FFFFFF; }
      .footer { font-family: 'PingFang SC', sans-serif; font-size: 11px; fill: #9CA3AF; }
    </style>
    <marker id="arrow-bz" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1F2937"/>
    </marker>
    <marker id="arrow-bz-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="900"/>

  <!-- 标题 -->
  <text class="title" x="60" y="56">保险关系与争议条款</text>
  <text class="subtitle" x="60" y="80">同一组事实 · 关系图 · 简洁商务风格</text>
  <text class="subtitle" x="1140" y="56" text-anchor="end">案由：追偿权纠纷</text>
  <text class="subtitle" x="1140" y="80" text-anchor="end">被告二：乙保险公司</text>

  <!-- 连接线 -->
  <line class="line" x1="190" y1="270" x2="190" y2="650" marker-end="url(#arrow-bz)"/>
  <line class="line line-accent" x1="1010" y1="270" x2="1010" y2="650" marker-end="url(#arrow-bz-accent)"/>
  <line class="line" x1="310" y1="695" x2="890" y2="225" marker-end="url(#arrow-bz)"/>
  <line class="line line-accent" x1="890" y1="695" x2="310" y2="225" marker-end="url(#arrow-bz-accent)"/>

  <!-- 投保人（左上） -->
  <g>
    <rect class="entity-box" x="70" y="180" width="240" height="90" rx="3"/>
    <text class="entity-role" x="190" y="208">ROLE · POLICYHOLDER</text>
    <text class="entity-name" x="190" y="234">丙网络科技公司</text>
    <text class="entity-sub" x="190" y="256">投保人 · 书面订立合同</text>
  </g>

  <!-- 被保险人（右上） -->
  <g>
    <rect class="entity-box" x="890" y="180" width="240" height="90" rx="3"/>
    <text class="entity-role" x="1010" y="208">ROLE · INSURED</text>
    <text class="entity-name" x="1010" y="234">被告甲</text>
    <text class="entity-sub" x="1010" y="256">配送骑手 · 保险利益归属</text>
  </g>

  <!-- 保险人（左下） -->
  <g>
    <rect class="entity-box" x="70" y="650" width="240" height="90" rx="3"/>
    <text class="entity-role" x="190" y="678">ROLE · INSURER</text>
    <text class="entity-name" x="190" y="704">乙保险公司</text>
    <text class="entity-sub" x="190" y="726">保险人 · 主张免赔</text>
  </g>

  <!-- 第三者（右下） -->
  <g>
    <rect class="entity-box" x="890" y="650" width="240" height="90" rx="3"/>
    <text class="entity-role" x="1010" y="678">ROLE · THIRD PARTY</text>
    <text class="entity-name" x="1010" y="704">案外人甲</text>
    <text class="entity-sub" x="1010" y="726">受害方 · 死亡</text>
  </g>

  <!-- 中心 -->
  <ellipse class="center-fill" cx="600" cy="460" rx="170" ry="55"/>
  <text class="center-tag" x="600" y="430">CORE · INSURANCE POLICY</text>
  <text class="center-title" x="600" y="455">附加个人第三者责任保险</text>
  <text class="center-sub" x="600" y="478">某短期意外伤害保险 · 附加险</text>

  <!-- 连接线标签（在中心椭圆之后绘制，确保不被遮挡；位置远离中心文字/边框） -->
  <rect class="line-label-bg" x="160" y="380" width="60" height="20" rx="3"/>
  <text class="line-label" x="190" y="394">投保</text>
  <rect class="line-label-bg" x="980" y="380" width="60" height="20" rx="3"/>
  <text class="line-label" x="1010" y="394" fill="#2563EB">侵权</text>
  <rect class="line-label-bg" x="540" y="380" width="120" height="20" rx="3"/>
  <text class="line-label" x="600" y="394">保险合同承保</text>
  <rect class="line-label-bg" x="540" y="525" width="120" height="20" rx="3"/>
  <text class="line-label" x="600" y="539" fill="#2563EB">主张赔偿</text>

  <!-- 限额条款 -->
  <g>
    <rect class="term-box" x="490" y="80" width="220" height="70" rx="3"/>
    <text class="term-h" x="600" y="102">LIMIT · DEDUCTIBLE</text>
    <text class="term-mono" x="600" y="124">75万 − 20万 = 55万</text>
    <text class="term-b" x="600" y="142">第三者人身伤亡限额</text>
  </g>

  <!-- 责任免除 -->
  <g>
    <rect class="term-box" x="40" y="425" width="200" height="70" rx="3"/>
    <text class="term-h" x="140" y="447">EXCLUSION · CLAUSE 7.3</text>
    <text class="term-b" x="140" y="467">第七条第三点</text>
    <text class="term-sub" x="140" y="485">无证 / 无行驶证 免责</text>
  </g>

  <!-- 第九条 -->
  <g>
    <rect class="term-box" x="960" y="425" width="200" height="70" rx="3"/>
    <text class="term-h" x="1060" y="447">CLAUSE · 9</text>
    <text class="term-b" x="1060" y="467">第九条</text>
    <text class="term-sub" x="1060" y="485">被保险人未赔偿不赔</text>
  </g>

  <!-- 特别约定 -->
  <g>
    <rect class="term-box" x="490" y="770" width="220" height="70" rx="3"/>
    <text class="term-h" x="600" y="792">SPECIAL · CLAUSE 9</text>
    <text class="term-b" x="600" y="812">特别约定 9</text>
    <text class="term-sub" x="600" y="830">无有效行驶证 / 未持证</text>
  </g>

  <line x1="60" y1="860" x2="1140" y2="860" stroke="#E5E7EB" stroke-width="1"/>
  <text class="footer" x="60" y="884">来源：src/services/mindmap/__fixtures__/hearing-realistic.md</text>
  <text class="footer" x="1140" y="884" text-anchor="end">同内容对比 · 简洁商务 · 02</text>
</svg>
