<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet">
  <!-- 同内容对比 · 浅色正式 · 关系图 · 来源：hearing-realistic.md -->
  <defs>
    <style>
      .bg { fill: #FBF8F1; }
      .title { font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 24px; font-weight: 600; fill: #1F3A5F; }
      .subtitle { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 13px; fill: #6B6B6B; }
      .entity-box { fill: #FFFFFF; stroke-width: 1.6; }
      .entity-role { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-anchor: middle; }
      .entity-name { font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 17px; font-weight: 600; text-anchor: middle; }
      .entity-sub { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 11px; fill: #6B6B6B; text-anchor: middle; }
      .term-box { fill: #FFFFFF; stroke: #B89F7A; stroke-width: 1.2; }
      .term-h { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 11px; font-weight: 600; fill: #8B5A2B; letter-spacing: 0.1em; text-anchor: middle; }
      .term-b { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 12px; fill: #3A3A3A; text-anchor: middle; }
      .term-mono { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 11px; fill: #8B2C2C; text-anchor: middle; }
      .center-fill { fill: #FBF8F1; stroke: #1F3A5F; stroke-width: 2; }
      .center-title { font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 17px; font-weight: 600; fill: #1F3A5F; text-anchor: middle; }
      .center-sub { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 12px; fill: #3A3A3A; text-anchor: middle; }
      .center-tag { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 10px; fill: #8B5A2B; letter-spacing: 0.1em; text-anchor: middle; }
      .line { stroke-width: 1.4; fill: none; }
      .line-label { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 11px; fill: #1F3A5F; text-anchor: middle; }
      .line-label-bg { fill: #FBF8F1; }
      .footer { font-family: 'PingFang SC', sans-serif; font-size: 11px; fill: #8C8478; }
    </style>
    <marker id="arrow-fm" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1F3A5F"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="900"/>

  <!-- 标题 -->
  <text class="title" x="60" y="56">保险关系与争议条款</text>
  <text class="subtitle" x="60" y="80">同一组事实 · 关系图 · 浅色正式风格</text>
  <text class="subtitle" x="1140" y="56" text-anchor="end">案由：追偿权纠纷</text>
  <text class="subtitle" x="1140" y="80" text-anchor="end">被告二：乙保险公司</text>

  <!-- 连接线（先画，被中心椭圆遮住） -->
  <line class="line" x1="190" y1="270" x2="190" y2="650" stroke="#1F3A5F" marker-end="url(#arrow-fm)"/>
  <line class="line" x1="1010" y1="270" x2="1010" y2="650" stroke="#8B2C2C" marker-end="url(#arrow-fm)"/>
  <line class="line" x1="310" y1="695" x2="890" y2="225" stroke="#1F3A5F" marker-end="url(#arrow-fm)"/>
  <line class="line" x1="890" y1="695" x2="310" y2="225" stroke="#8B2C2C" marker-end="url(#arrow-fm)"/>

  <!-- 投保人（左上） -->
  <g>
    <rect class="entity-box" x="70" y="180" width="240" height="90" rx="4" stroke="#1F3A5F"/>
    <text class="entity-role" x="190" y="208" fill="#1F3A5F">投 保 人</text>
    <text class="entity-name" x="190" y="234" fill="#1F3A5F">丙网络科技公司</text>
    <text class="entity-sub" x="190" y="256">书面订立合同 · 投保</text>
  </g>

  <!-- 被保险人（右上） -->
  <g>
    <rect class="entity-box" x="890" y="180" width="240" height="90" rx="4" stroke="#8B2C2C"/>
    <text class="entity-role" x="1010" y="208" fill="#8B2C2C">被保险人</text>
    <text class="entity-name" x="1010" y="234" fill="#8B2C2C">被告甲</text>
    <text class="entity-sub" x="1010" y="256">配送骑手 · 保险利益归属</text>
  </g>

  <!-- 保险人（左下） -->
  <g>
    <rect class="entity-box" x="70" y="650" width="240" height="90" rx="4" stroke="#1F3A5F"/>
    <text class="entity-role" x="190" y="678" fill="#1F3A5F">保 险 人</text>
    <text class="entity-name" x="190" y="704" fill="#1F3A5F">乙保险公司</text>
    <text class="entity-sub" x="190" y="726">承保 · 主张免赔</text>
  </g>

  <!-- 第三者（右下） -->
  <g>
    <rect class="entity-box" x="890" y="650" width="240" height="90" rx="4" stroke="#8B2C2C"/>
    <text class="entity-role" x="1010" y="678" fill="#8B2C2C">第 三 者</text>
    <text class="entity-name" x="1010" y="704" fill="#8B2C2C">案外人甲</text>
    <text class="entity-sub" x="1010" y="726">受害方 · 死亡</text>
  </g>

  <!-- 中心节点（绘制顺序在连线之后，遮住中段） -->
  <ellipse class="center-fill" cx="600" cy="460" rx="160" ry="55"/>
  <text class="center-tag" x="600" y="430">保险合同核心</text>
  <text class="center-title" x="600" y="455">附加个人第三者责任保险</text>
  <text class="center-sub" x="600" y="478">某短期意外伤害保险 · 附加险</text>

  <!-- 连接线标签（在中心椭圆之后绘制，确保不被遮挡；位置远离中心文字/边框） -->
  <rect class="line-label-bg" x="160" y="380" width="60" height="20" rx="3"/>
  <text class="line-label" x="190" y="394">投保</text>
  <rect class="line-label-bg" x="980" y="380" width="60" height="20" rx="3"/>
  <text class="line-label" x="1010" y="394" fill="#8B2C2C">侵权</text>
  <rect class="line-label-bg" x="540" y="380" width="120" height="20" rx="3"/>
  <text class="line-label" x="600" y="394">保险合同承保</text>
  <rect class="line-label-bg" x="540" y="525" width="120" height="20" rx="3"/>
  <text class="line-label" x="600" y="539" fill="#8B2C2C">主张赔偿</text>

  <!-- 限额条款（顶部边缘） -->
  <g>
    <rect class="term-box" x="490" y="80" width="220" height="70" rx="4"/>
    <text class="term-h" x="600" y="102">限额与免赔</text>
    <text class="term-mono" x="600" y="122">75 万 − 20 万 = 55 万</text>
    <text class="term-b" x="600" y="140">第三者每人人身伤亡</text>
  </g>

  <!-- 责任免除（左侧边缘） -->
  <g>
    <rect class="term-box" x="40" y="425" width="200" height="70" rx="4"/>
    <text class="term-h" x="140" y="447">责任免除</text>
    <text class="term-b" x="140" y="467">第七条第三点</text>
    <text class="term-sub" x="140" y="485" fill="#8B2C2C" font-size="10" font-family="PingFang SC">无证 / 无行驶证 免责</text>
  </g>

  <!-- 第九条（右侧边缘） -->
  <g>
    <rect class="term-box" x="960" y="425" width="200" height="70" rx="4"/>
    <text class="term-h" x="1060" y="447">条款第九条</text>
    <text class="term-b" x="1060" y="467">被保险人未赔偿</text>
    <text class="term-sub" x="1060" y="485" fill="#8B2C2C" font-size="10" font-family="PingFang SC">保险人不赔</text>
  </g>

  <!-- 特别约定（底部边缘） -->
  <g>
    <rect class="term-box" x="490" y="770" width="220" height="70" rx="4"/>
    <text class="term-h" x="600" y="792">特别约定</text>
    <text class="term-b" x="600" y="812">第 9 点 · 交通工具约定</text>
    <text class="term-sub" x="600" y="830" fill="#8B2C2C" font-size="10" font-family="PingFang SC">无有效行驶证 / 未持证</text>
  </g>

  <line x1="60" y1="860" x2="1140" y2="860" stroke="#D8CDB5" stroke-width="1"/>
  <text class="footer" x="60" y="884">来源：src/services/mindmap/__fixtures__/hearing-realistic.md</text>
  <text class="footer" x="1140" y="884" text-anchor="end">同内容对比 · 浅色正式 · 01</text>
</svg>
