      .term-b { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 12px; fill: #F8FAFC; text-anchor: middle; }
      .term-mono { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #22D3EE; text-anchor: middle; }
      .term-sub { font-family: 'PingFang SC', sans-serif; font-size: 10px; fill: #94A3B8; text-anchor: middle; }
