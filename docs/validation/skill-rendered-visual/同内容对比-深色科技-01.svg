<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet">
  <!-- 同内容对比 · 深色科技 · 关系图 · 来源：hearing-realistic.md -->
  <defs>
    <style>
      .bg { fill: #0F172A; }
      .grid { stroke: #1E293B; stroke-width: 0.5; fill: none; }
      .title { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 24px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.05em; }
      .subtitle { font-family: 'PingFang SC', sans-serif; font-size: 13px; fill: #94A3B8; }
