    <rect class="entity-box" x="890" y="650" width="240" height="90" rx="6" stroke="#FB7185"/>
    <rect x="890" y="650" width="240" height="90" rx="6" fill="rgba(136,19,55,0.4)" stroke="#FB7185" stroke-width="1.6"/>
