<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" preserveAspectRatio="xMidYMid meet">
  <!-- 浅色正式 · 时间轴 · 来源：hearing-realistic.md -->
  <defs>
    <style>
      .bg { fill: #FBF8F1; }
      .title { font-family: 'Songti SC', 'Noto Serif CJK SC', 'SimSun', serif; font-size: 26px; font-weight: 600; fill: #1F3A5F; }
      .subtitle { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 13px; fill: #6B6B6B; }
      .axis { stroke: #1F3A5F; stroke-width: 2; }
      .axis-tick { stroke: #1F3A5F; stroke-width: 1; }
      .node-ring { fill: #FBF8F1; stroke: #1F3A5F; stroke-width: 2.5; }
      .node-dot { fill: #8B2C2C; }
      .node-num { font-family: 'Songti SC', serif; font-size: 14px; font-weight: 600; fill: #FBF8F1; text-anchor: middle; }
      .card-above { fill: #FFFFFF; stroke: #1F3A5F; stroke-width: 1.2; }
      .card-below { fill: #FFFFFF; stroke: #1F3A5F; stroke-width: 1.2; }
      .step-title { font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 15px; font-weight: 600; fill: #1F3A5F; text-anchor: middle; }
      .step-body { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 12px; fill: #3A3A3A; text-anchor: middle; }
      .step-meta { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 11px; fill: #8B2C2C; text-anchor: middle; }
      .connector { stroke: #1F3A5F; stroke-width: 1; fill: none; stroke-dasharray: 2 3; }
      .footer { font-family: 'PingFang SC', 'Noto Sans CJK SC', sans-serif; font-size: 11px; fill: #8C8478; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect class="bg" width="1400" height="780"/>

  <!-- 标题区 -->
  <text class="title" x="60" y="56">案件进展时间轴</text>
  <text class="subtitle" x="60" y="80">案由：追偿权纠纷　|　原告：甲公司　|　被告一：被告甲　|　被告二：乙保险公司</text>

  <!-- 主轴线 -->
  <line class="axis" x1="60" y1="380" x2="1340" y2="380"/>
  <!-- 左端装饰 -->
  <circle cx="60" cy="380" r="6" fill="#1F3A5F"/>
  <text class="footer" x="60" y="406" text-anchor="start">起点</text>
  <!-- 右端装饰 -->
  <circle cx="1340" cy="380" r="6" fill="#8B2C2C"/>
  <text class="footer" x="1340" y="406" text-anchor="end">庭审中</text>

  <!-- 事件 1：上方 · 平台用工 -->
  <g>
    <line class="connector" x1="140" y1="380" x2="140" y2="300"/>
    <rect class="card-above" x="50" y="160" width="200" height="140" rx="3"/>
    <text class="step-title" x="150" y="188">平台用工关系</text>
    <text class="step-body" x="150" y="216">甲公司与骑手签订</text>
    <text class="step-body" x="150" y="234">《共享经济平台服务协议》</text>
    <text class="step-body" x="150" y="262">三件套：协议 / 投保 / 配送</text>
    <text class="step-meta" x="150" y="286">用工与配送基础</text>
    <circle class="node-ring" cx="140" cy="380" r="16"/>
    <circle class="node-dot" cx="140" cy="380" r="9"/>
    <text class="node-num" x="140" y="385">1</text>
  </g>

  <!-- 事件 2：下方 · 交通事故 -->
  <g>
    <line class="connector" x1="350" y1="380" x2="350" y2="460"/>
    <rect class="card-below" x="260" y="460" width="200" height="140" rx="3"/>
    <text class="step-title" x="360" y="488">交通事故发生</text>
    <text class="step-body" x="360" y="516">被告甲无证驾驶无有效</text>
    <text class="step-body" x="360" y="534">行驶证机动车</text>
    <text class="step-body" x="360" y="562">造成案外人死亡</text>
    <text class="step-meta" x="360" y="586">事故经过</text>
    <circle class="node-ring" cx="350" cy="380" r="16"/>
    <circle class="node-dot" cx="350" cy="380" r="9"/>
    <text class="node-num" x="350" y="385">2</text>
  </g>

  <!-- 事件 3：上方 · 责任认定 -->
  <g>
    <line class="connector" x1="560" y1="380" x2="560" y2="300"/>
    <rect class="card-above" x="470" y="160" width="200" height="140" rx="3"/>
    <text class="step-title" x="570" y="188">责任认定</text>
    <text class="step-body" x="570" y="216">《道路交通事故认定书》</text>
    <text class="step-body" x="570" y="234">被告甲：主要责任</text>
    <text class="step-body" x="570" y="262">案外人甲：次要责任</text>
    <text class="step-meta" x="570" y="286">浙江 · 交管部门</text>
    <circle class="node-ring" cx="560" cy="380" r="16"/>
    <circle class="node-dot" cx="560" cy="380" r="9"/>
    <text class="node-num" x="560" y="385">3</text>
  </g>

  <!-- 事件 4：下方 · 调解与赔付 -->
  <g>
    <line class="connector" x1="770" y1="380" x2="770" y2="460"/>
    <rect class="card-below" x="680" y="460" width="200" height="140" rx="3"/>
    <text class="step-title" x="780" y="488">调解与赔付</text>
    <text class="step-body" x="780" y="516">XX交调XXXX第XXXX号</text>
    <text class="step-body" x="780" y="534">调解协议书</text>
    <text class="step-body" x="780" y="562">被告甲 35,000 元</text>
    <text class="step-meta" x="780" y="586">原告公司 1,000,000 元</text>
    <circle class="node-ring" cx="770" cy="380" r="16"/>
    <circle class="node-dot" cx="770" cy="380" r="9"/>
    <text class="node-num" x="770" y="385">4</text>
  </g>

  <!-- 事件 5：上方 · 原告付款 -->
  <g>
    <line class="connector" x1="980" y1="380" x2="980" y2="300"/>
    <rect class="card-above" x="890" y="160" width="200" height="140" rx="3"/>
    <text class="step-title" x="990" y="188">原告已实际付款</text>
    <text class="step-body" x="990" y="216">招商银行出账回单</text>
    <text class="step-body" x="990" y="234">1,000,000 元</text>
    <text class="step-body" x="990" y="262">已按调解协议履行</text>
    <text class="step-meta" x="990" y="286">付款事实成立</text>
    <circle class="node-ring" cx="980" cy="380" r="16"/>
    <circle class="node-dot" cx="980" cy="380" r="9"/>
    <text class="node-num" x="980" y="385">5</text>
  </g>

  <!-- 事件 6：下方 · 起诉与开庭 -->
  <g>
    <line class="connector" x1="1190" y1="380" x2="1190" y2="460"/>
    <rect class="card-below" x="1100" y="460" width="200" height="140" rx="3"/>
    <text class="step-title" x="1200" y="488">起诉与开庭</text>
    <text class="step-body" x="1200" y="516">追偿 125,000 元（被告一）</text>
    <text class="step-body" x="1200" y="534">保险责任 750,000 元</text>
    <text class="step-body" x="1200" y="562">（被告二）</text>
    <text class="step-meta" x="1200" y="586">庭审记录须完整</text>
    <circle class="node-ring" cx="1190" cy="380" r="16"/>
    <circle class="node-dot" cx="1190" cy="380" r="9"/>
    <text class="node-num" x="1190" y="385">6</text>
  </g>

  <!-- 阶段标签 -->
  <text class="footer" x="350" y="332" text-anchor="middle">事故与责任</text>
  <text class="footer" x="770" y="332" text-anchor="middle">调解与履行</text>
  <text class="footer" x="1190" y="332" text-anchor="middle">追偿诉讼</text>

  <text class="footer" x="140" y="428" text-anchor="middle">用工基础</text>
  <text class="footer" x="560" y="428" text-anchor="middle">责任认定</text>
  <text class="footer" x="980" y="428" text-anchor="middle">已付凭证</text>

  <!-- 图例 -->
  <g transform="translate(60, 700)">
    <rect x="0" y="0" width="14" height="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.2"/>
    <text class="footer" x="22" y="12">事件节点</text>
    <line x1="120" y1="7" x2="150" y2="7" class="axis-tick"/>
    <circle cx="160" cy="7" r="5" fill="#8B2C2C"/>
    <text class="footer" x="172" y="12">顺序节点</text>
    <text class="footer" x="280" y="12">来源：src/services/mindmap/__fixtures__/hearing-realistic.md</text>
  </g>
  <text class="footer" x="1340" y="712" text-anchor="end">浅色正式 · 风格 01 · 时间轴</text>
</svg>
